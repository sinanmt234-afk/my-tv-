<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aether Home</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:"SF Pro Display","Helvetica Neue",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
#bg{position:fixed;inset:0;background:url(wallpaper.jpg) center/cover no-repeat #111}
#shade{position:fixed;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.35) 0%,rgba(0,0,0,.05) 35%,rgba(0,0,0,.65) 100%)}
#up{position:fixed;top:2.2vh;left:0;right:0;text-align:center;font-size:2vw;color:#ffd84a;opacity:.9;line-height:1}
#hero{position:fixed;left:4.5vw;top:7vh;max-width:50vw}
#hname{font-size:5.4vw;font-weight:800;letter-spacing:-.02em;line-height:1;text-transform:uppercase;text-shadow:0 .3vw 1.6vw rgba(0,0,0,.6)}
#hsub{font-size:1.5vw;margin-top:1vw;opacity:.85;text-shadow:0 .2vw 1vw rgba(0,0,0,.7)}
#side{position:fixed;top:4vh;right:4vw;width:27vw}
#bar{display:flex;justify-content:flex-end;font-size:1.5vw;font-weight:600;margin-bottom:1.2vw;text-shadow:0 .2vw 1vw rgba(0,0,0,.6)}
#card{height:13vw;border-radius:1.6vw;padding:1.6vw 1.8vw;background:linear-gradient(135deg,rgba(15,25,50,.78),rgba(30,45,80,.55));display:flex;flex-direction:column;justify-content:flex-end;position:relative}
#live{position:absolute;top:1.1vw;right:1.1vw;background:#ff9f0a;color:#000;font-size:.9vw;font-weight:800;padding:.2vw .6vw;border-radius:.5vw}
#gr{font-size:1.4vw;opacity:.8}
#big{font-size:4.6vw;font-weight:300;letter-spacing:-.03em;line-height:1.1}
#dt{font-size:1.3vw;opacity:.7;margin-top:.2vw}
#fl{font-size:1.05vw;font-weight:700;letter-spacing:.08em;margin:1.4vw 0 .7vw;text-shadow:0 .2vw 1vw rgba(0,0,0,.7)}
#fav{display:grid;grid-template-columns:1fr 1fr;gap:.8vw}
.p{height:3.6vw;border-radius:1.2vw;background:rgba(15,25,50,.72);display:flex;align-items:center;gap:.7vw;padding:0 1vw;font-size:1.15vw;font-weight:500;transition:transform .15s,background .15s;will-change:transform}
.p img,.p b{width:2.1vw;height:2.1vw;flex:0 0 auto;border-radius:.5vw;object-fit:contain}
.p b{display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.18);font-size:1.2vw}
.p span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.p.f{background:#fff;color:#111;transform:scale(1.06)}
#panel{position:fixed;left:3vw;right:3vw;bottom:5vh;height:13vw;border-radius:2.2vw;background:rgba(235,235,245,.28);overflow:hidden}
#row{position:relative;display:flex;align-items:center;gap:1.4vw;height:100%;padding:0 1.6vw;width:max-content;transition:transform .25s ease-out;will-change:transform}
.t{flex:0 0 auto;width:14vw;height:9vw;border-radius:1.3vw;background:rgba(20,22,32,.82);display:flex;align-items:center;justify-content:center;transition:transform .16s ease-out,box-shadow .16s;will-change:transform}
.t img{width:5.6vw;height:5.6vw;object-fit:contain;border-radius:1vw}
.t .ph{font-size:3.6vw;font-weight:700;opacity:.85}
.t.f{transform:scale(1.12);box-shadow:0 1.2vw 2.6vw rgba(0,0,0,.55),0 0 0 .2vw rgba(255,255,255,.95)}
</style></head><body>
<div id="bg"></div><div id="shade"></div>
<div id="up">&#8963;</div>
<div id="hero"><div id="hname"></div><div id="hsub">Press OK to open</div></div>
<div id="side">
  <div id="bar"><span id="clock"></span></div>
  <div id="card"><div id="live">HOME</div><div id="gr"></div><div id="big"></div><div id="dt"></div></div>
  <div id="fl">FAVORITE APPS</div>
  <div id="fav"></div>
</div>
<div id="panel"><div id="row"></div></div>
<script>
var hasA=typeof Android!=='undefined',apps=[],tiles=[],favs=[],pills=[],cache={},idx=0,fidx=0,zone='dock';
var row=document.getElementById('row'),panel=document.getElementById('panel'),fav=document.getElementById('fav');
function $(i){return document.getElementById(i)}
function clock(){
  var d=new Date(),h=d.getHours(),t=d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
  $('clock').textContent=t;$('big').textContent=t;
  $('gr').textContent=h<12?'Good Morning':h<17?'Good Afternoon':'Good Evening';
  $('dt').textContent=d.toLocaleDateString([],{weekday:'long',day:'numeric',month:'long'});
}
clock();setInterval(clock,20000);
function setIcon(el,pkg,n,cls){
  var s=cache[pkg];
  if(s){el.innerHTML='<img src="'+s+'"><'+(cls==='p'?'span':'i')+'></'+(cls==='p'?'span':'i')+'>'}
}
function tileHTML(a){return cache[a.p]?'<img src="'+cache[a.p]+'">':'<div class="ph">'+a.n.charAt(0)+'</div>'}
function pillHTML(a){return (cache[a.p]?'<img src="'+cache[a.p]+'">':'<b>'+a.n.charAt(0)+'</b>')+'<span></span>'}
function load(){
  try{apps=hasA?JSON.parse(Android.getApps()):[{p:'1',n:'YouTube'},{p:'2',n:'Netflix'},{p:'3',n:'Prime Video'},{p:'4',n:'Music'},{p:'5',n:'Photos'},{p:'6',n:'Browser'},{p:'7',n:'Files'},{p:'8',n:'Games'}]}catch(e){apps=[]}
  apps.push({p:'__settings',n:'Settings'});
  row.innerHTML='';tiles=[];
  apps.forEach(function(a,i){
    var t=document.createElement('div');t.className='t';t.innerHTML=tileHTML(a);
    t.onclick=function(){idx=i;zone='dock';draw();openApp(a)};
    row.appendChild(t);tiles.push(t);
  });
  var names=['youtube','netflix','prime','hotstar','chrome','play store','settings','files','music','photos','browser','spotify'];
  favs=[];
  names.forEach(function(n){for(var i=0;i<apps.length;i++){if(apps[i].n.toLowerCase().indexOf(n)>-1&&favs.indexOf(i)<0){favs.push(i);break}}});
  for(var i=0;i<apps.length&&favs.length<8;i++)if(favs.indexOf(i)<0)favs.push(i);
  favs=favs.slice(0,8);
  fav.innerHTML='';pills=[];
  favs.forEach(function(ai,k){
    var p=document.createElement('div');p.className='p';p.innerHTML=pillHTML(apps[ai]);
    p.lastChild.textContent=apps[ai].n;
    p.onclick=function(){fidx=k;zone='fav';draw();openApp(apps[ai])};
    fav.appendChild(p);pills.push(p);
  });
  idx=Math.min(idx,tiles.length-1);fidx=0;draw();
  if(hasA)queue(0);
}
function queue(i){
  if(i>=apps.length-1)return;
  setTimeout(function(){
    var a=apps[i];
    if(!cache[a.p]){var s=Android.getIcon(a.p);if(s)cache[a.p]=s}
    if(cache[a.p]){
      tiles[i].innerHTML=tileHTML(a);
      var k=favs.indexOf(i);
      if(k>-1){pills[k].innerHTML=pillHTML(a);pills[k].lastChild.textContent=a.n}
    }
    queue(i+1);
  },0);
}
function draw(){
  tiles.forEach(function(t,i){t.className='t'+(zone==='dock'&&i===idx?' f':'')});
  pills.forEach(function(p,i){p.className='p'+(zone==='fav'&&i===fidx?' f':'')});
  var a=zone==='dock'?apps[idx]:apps[favs[fidx]];
  $('hname').textContent=a?a.n:'';
  var t=tiles[idx];
  if(t){
    var x=t.offsetLeft-(panel.clientWidth-t.offsetWidth)/2,max=row.scrollWidth-panel.clientWidth;
    x=Math.max(0,Math.min(x,max));row.style.transform='translate3d('+(-x)+'px,0,0)';
  }
}
function openApp(a){if(!a||!hasA)return;if(a.p==='__settings')Android.openSettings();else Android.launch(a.p)}
document.addEventListener('keydown',function(e){
  var k=e.keyCode,used=true;
  if(k===13||k===23||k===66||k===32){openApp(zone==='dock'?apps[idx]:apps[favs[fidx]]);e.preventDefault();return}
  if(zone==='dock'){
    if(k===39||k===22){if(idx<tiles.length-1)idx++}
    else if(k===37||k===21){if(idx>0)idx--}
    else if(k===38||k===19){if(pills.length){zone='fav';fidx=0}}
    else used=false;
  }else{
    var n=pills.length;
    if(k===39||k===22){if(fidx%2===0&&fidx+1<n)fidx++}
    else if(k===37||k===21){if(fidx%2===1)fidx--}
    else if(k===38||k===19){if(fidx>=2)fidx-=2}
    else if(k===40||k===20){if(fidx+2<n)fidx+=2;else zone='dock'}
    else used=false;
  }
  if(used){draw();e.preventDefault()}
});
window.refreshApps=function(){load()};
window.goHome=function(){zone='dock';idx=0;draw()};
load();
</script></body></html>
